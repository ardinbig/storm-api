name: CI

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"

# Global environment configuration.
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  RUST_LOG: info

jobs:

  # Runs code quality checks using rustfmt and clippy.
  lint:
    name: Code Quality (Formating & Clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: api

      - name: Check Rust Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy Linter
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # Executes all tests using cargo-nextest.
  tests:
    name: Test Suits
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: lint

    services:

      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: storm
          POSTGRES_PASSWORD: storm_secret
          POSTGRES_DB: storm_test
        ports:
          - 5432:5432
        options: >-
          --mount type=tmpfs,destination=/var/lib/postgresql/data
          --health-cmd "pg_isready -U storm"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 3

      redis:
        image: redis:8-bookworm
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 3

    env:
      DATABASE_URL: postgres://storm:storm_secret@localhost:5432/storm_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: api

      - name: Setup Cargo Test Tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest, sqlx-cli

      - name: Execute Unit Tests
        run: cargo nextest run --test unit

      - name: Run Database Migrations
        run: sqlx migrate run --source migrations

      - name: Run Integration Tests
        run: cargo nextest run --test integration --run-ignored all

  # Generates code coverage reports.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Coverage is only generated for pushes to the main branch.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs: tests

    services:

      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: storm
          POSTGRES_PASSWORD: storm_secret
          POSTGRES_DB: storm_test
        ports:
          - 5432:5432
        options: >-
          --mount type=tmpfs,destination=/var/lib/postgresql/data
          --health-cmd "pg_isready -U storm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8-bookworm
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://storm:storm_secret@localhost:5432/storm_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

    steps:
      - uses: actions/checkout@v7

      # Installs LLVM tooling required for coverage instrumentation.
      - name: Setup Rust Toolchain (llvm-cov)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: api

      # Installs cargo-llvm-cov + nextest for coverage generation.
      - name: Install Coverage Tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov, cargo-nextest

      # Generates LCOV coverage report.
      # Excludes main.rs files from coverage calculation.
      - name: Run Tests & Generate Coverage Report
        run: |
          cargo llvm-cov nextest \
            --workspace \
            --all-features \
            --fail-under-lines 80 \
            --ignore-filename-regex "main\.rs" \
            --lcov \
            --output-path lcov.info

      # Uploads coverage metrics to Codecov.
      # Token is stored securely as a GitHub Actions secret.
      - name: Upload Coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
