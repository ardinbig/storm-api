name: "CodeQL"

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'tests/**'
      - '**/tests/**'
      - '**/*_test.rs'
      - '**/test_*.rs'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'tests/**'
      - '**/tests/**'
      - '**/*_test.rs'
      - '**/test_*.rs'
  schedule:
    - cron: '0 9 * * 6'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: rust
            build-mode: none

    steps:
      - uses: actions/checkout@v7

      - name: Setup CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"
